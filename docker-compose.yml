services:
  mysql:
    image: mysql:8.0
    container_name: agendaDatabase
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "pw123az987"
      MYSQL_DATABASE: agenda
      MYSQL_USER: devs
      MYSQL_PASSWORD: "pw1234"
    entrypoint:
      sh -c "echo 'CREATE DATABASE IF NOT EXISTS firstDB; CREATE DATABASE IF NOT EXISTS agenda-test;' > /docker-entrypoint-initdb.d/init.sql;
      /usr/local/bin/docker-entrypoint.sh --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/java/infrastructure/sql/structure.sql:/docker-entrypoint-initdb.d/structure.sql:ro

volumes:
  mysql_data:
